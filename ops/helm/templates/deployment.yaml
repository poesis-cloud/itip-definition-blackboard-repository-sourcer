apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sourcer.fullname" . }}
  labels:
    app: {{ include "sourcer.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "sourcer.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "sourcer.fullname" . }}
    spec:
      containers:
        - name: sourcer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: BLACKBOARD_BASE_URL
              value: {{ .Values.env.BLACKBOARD_BASE_URL | quote }}
            - name: OIDC_ISSUER_URI
              value: {{ .Values.env.OIDC_ISSUER_URI | quote }}
            - name: OAUTH2_CLIENT_ID
              value: {{ .Values.env.OAUTH2_CLIENT_ID | quote }}
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sourcer.fullname" . }}-secret
                  key: OAUTH2_CLIENT_SECRET
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
