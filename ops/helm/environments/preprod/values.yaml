# Preprod environment values

replicaCount: 1

image:
  repository: ghcr.io/your-org/itip-definition-blackboard-repository-sourcer
  tag: "0.1.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

env:
  BLACKBOARD_BASE_URL: http://sie-definition-blackboard-manager.sie.svc.cluster.local:8080
  OIDC_ISSUER_URI: https://idp.preprod.example/realms/sie
  OAUTH2_CLIENT_ID: itip-sourcer
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317

secrets:
  OAUTH2_CLIENT_SECRET: ""

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

nodeSelector: {}
tolerations: []
affinity: {}
