server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: itip-definition-blackboard-repository-sourcer
  security:
    oauth2:
      client:
        registration:
          blackboard:
            client-id: ${OAUTH2_CLIENT_ID:itip-sourcer}
            client-secret: ${OAUTH2_CLIENT_SECRET:change-me}
            authorization-grant-type: client_credentials
            scope: blackboard.contribute
        provider:
          blackboard:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:9000/realms/sie}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

sourcer:
  blackboard:
    base-url: ${BLACKBOARD_BASE_URL:http://localhost:8080}
  contributions:
    schema-pattern: ${SOURCER_CONTRIBUTION_SCHEMA_PATTERN:classpath:contributions/**/*.schema.json}
